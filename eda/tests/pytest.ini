[pytest]
# Self-contained research test suite (dev-only). Run from the repo root:
#   .venv/Scripts/python -m pytest -q eda/tests
# This ini makes eda/tests the rootdir, so tests/runtime (P2's suite) is never collected here.
testpaths = .
python_files = test_*.py
bdd_features_base_dir = features/
addopts = -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
